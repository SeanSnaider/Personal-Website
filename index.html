<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sean Snaider | Software Engineer</title>
    <meta
      name="description"
      content="Sean Snaider: Computer Science student at Northeastern University and G&amp;A Architecture and Strategy Co-op at Vertex Pharmaceuticals, building real-time audio software (including BellyDSP, an open-source guitar amp simulator) and full-stack tools in React, TypeScript, and Python."
    />
    <meta name="author" content="Sean Snaider" />
    <meta name="theme-color" content="#15181d" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The sleeve cover's source: fetched early because the first viewport
         is drawn from it. -->
    <link rel="preload" as="image" type="image/webp" href="/bellydsp-cover.webp" />
    <link rel="canonical" href="https://seansnaider.com/" />

    <!--
      og-card.png is rendered from og/home.html by og/render.sh. Keep it
      1200x630 and keep the URL absolute, since LinkedIn and X ignore relative
      paths.
    -->

    <!-- Open Graph / LinkedIn link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sean Snaider | Software Engineer" />
    <meta
      property="og:description"
      content="CS @ Northeastern. Co-op at Vertex Pharmaceuticals. Builder of BellyDSP, an open-source guitar amp simulator, and full-stack tools."
    />
    <meta property="og:url" content="https://seansnaider.com/" />
    <meta property="og:site_name" content="Sean Snaider" />
    <meta property="og:image" content="https://seansnaider.com/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sean Snaider, Software Engineer, Boston, MA, over a green waveform: Northeastern CS, co-op at Vertex, built BellyDSP" />

    <!-- Twitter/X link previews -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sean Snaider | Software Engineer" />
    <meta
      name="twitter:description"
      content="CS &amp; Software Engineering @ Northeastern. Co-op at Vertex Pharmaceuticals."
    />
    <meta name="twitter:image" content="https://seansnaider.com/og-card.png" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
