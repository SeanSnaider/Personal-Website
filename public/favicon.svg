  background color, matching --site-bg and --site-accent in src/App.css.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#05040a" />
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="2" />
  <text
    x="32"
    y="33"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="'JetBrains Mono', ui-monospace, monospace"
    font-size="28"
    font-weight="700"
    fill="#a78bfa"
  >SS</text>
</svg>
